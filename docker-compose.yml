services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: newbid
      POSTGRES_PASSWORD: newbid
      POSTGRES_DB: newbid
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newbid -d newbid"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://newbid:newbid@db:5432/newbid
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db-data:
