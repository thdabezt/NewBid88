services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: newbid
      POSTGRES_PASSWORD: newbid
      POSTGRES_DB: newbid
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newbid -d newbid"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
